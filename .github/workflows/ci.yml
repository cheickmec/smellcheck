name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test deps
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest tests/ -v
      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: pytest tests/ -v --cov=smellcheck --cov-report=xml --cov-report=term --cov-fail-under=85
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Self-check
        run: smellcheck src/smellcheck/ --min-severity warning

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and type deps
        run: pip install -e ".[type]"
      - name: Run mypy
        run: mypy src/smellcheck/
        continue-on-error: true

  code-scanning:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Generate SARIF
        run: smellcheck src/smellcheck/ --format sarif --min-severity warning > results.sarif
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
        if: always()

  vendor-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-vendor-sync.sh

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README links are absolute
        run: python3 scripts/check-readme-links.py
      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress README.md docs/
          fail: true

  version-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test deps
        run: pip install -e . && pip install pytest
      - name: Verify version parity
        run: pytest tests/test_version_parity.py -v
